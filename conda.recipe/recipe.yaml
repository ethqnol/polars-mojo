context:
  name: molars
  version: "0.1.0"
  mojo_version: "=1.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # For local testing in this repo:
  path: ..
  # When submitting PR to modular-community, change to:
  # - git: https://github.com/ethqnol/polars-mojo.git
  #   rev: v${{ version }}

build:
  number: 0
  script:
    - cargo build --release

    - mkdir -p ${{ PREFIX }}/lib
    - cp target/release/libpolars_ffi.so ${{ PREFIX }}/lib/
    - cp target/release/libpolars_ffi.a ${{ PREFIX }}/lib/

    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile mojo -o ${{ PREFIX }}/lib/mojo/molars.mojoc
    - cp -r mojo ${{ PREFIX }}/lib/mojo/molars

    - mkdir -p ${{ PREFIX }}/etc/conda/activate.d ${{ PREFIX }}/etc/conda/deactivate.d
    - |
      cat << 'EOF' > ${{ PREFIX }}/etc/conda/activate.d/molars.sh
      export _MOLARS_OLD_LIBRARY_PATH="${LIBRARY_PATH:-}"
      export _MOLARS_OLD_LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
      export LIBRARY_PATH="${CONDA_PREFIX}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}"
      export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
      EOF
    - |
      cat << 'EOF' > ${{ PREFIX }}/etc/conda/deactivate.d/molars.sh
      if [ -n "${_MOLARS_OLD_LIBRARY_PATH+x}" ]; then
          export LIBRARY_PATH="${_MOLARS_OLD_LIBRARY_PATH}"
          unset _MOLARS_OLD_LIBRARY_PATH
      fi
      if [ -n "${_MOLARS_OLD_LD_LIBRARY_PATH+x}" ]; then
          export LD_LIBRARY_PATH="${_MOLARS_OLD_LD_LIBRARY_PATH}"
          unset _MOLARS_OLD_LD_LIBRARY_PATH
      fi
      EOF

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - test -f ${{ PREFIX }}/lib/libpolars_ffi.so
      - test -f ${{ PREFIX }}/lib/libpolars_ffi.a
      - test -f ${{ PREFIX }}/lib/mojo/molars.mojoc
      - |
        cat << 'EOF' > smoke_test.mojo
        from molars import DataFrame
        fn main():
            _ = DataFrame
        EOF
      - mojo run -Xlinker -L${{ PREFIX }}/lib -Xlinker -lpolars_ffi smoke_test.mojo

about:
  homepage: https://github.com/ethqnol/polars-mojo
  license: Apache-2.0
  summary: Polars DataFrame bindings for Mojo via Arrow C Data Interface


