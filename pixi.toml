[workspace]
authors = ["Ethan Wu"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "polars-mojo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build-rust = "cargo build --release"
test-abi = { cmd = "./build.sh tests/test_arrow_abi.mojo --run", depends-on = ["build-rust"] }
test-dataframe = { cmd = "./build.sh tests/test_dataframe.mojo --run", depends-on = ["build-rust"] }
tests = { cmd = "./build.sh tests/test_arrow_abi.mojo --run && ./build.sh tests/test_dataframe.mojo --run", depends-on = ["build-rust"] }
test = { depends-on = ["tests"] }
benchmark = { cmd = "./build.sh tests/test_simd_benchmark.mojo --run", depends-on = ["build-rust"] }
docs = "python3 scripts/generate_docs.py"

[dependencies]
